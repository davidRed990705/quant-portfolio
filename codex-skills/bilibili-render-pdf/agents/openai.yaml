interface:
  display_name: "Bilibili Render PDF"
  short_description: "Use Codex to turn a Bilibili/YouTube URL, URL list, or local video into a Chinese textbook-style note with audited keyframes and teaching visuals."
  default_prompt: "Use this Codex-native skill to turn a Bilibili/YouTube URL, URL text file, or local video/transcript pair into a Chinese LaTeX/PDF teaching note or zero-foundation trading textbook. If the input is a URL or URL file, first run source acquisition to deduplicate video identities and parts, download/probe metadata, video, cover, and platform subtitles, preserve timestamps, and write acquisition_manifest.json before knowledge extraction. Codex should lead transcript understanding, semantic chaptering, finance knowledge extraction, visual question design, frame interpretation, visual rewrite design, and final teaching writing. Use tools only for mechanical operations such as URL acquisition, media download, subtitle normalization, frame extraction, crop application, contact sheets, compositing, PDF compilation, and cleanup. Create detailed knowledge points from the timestamped transcript, build subtitle-aligned 0.5-second dense keyframe candidates, inspect selected frames, create focus crops and visual rewrite prompts, use Codex image generation for polished text-free visual backgrounds when available, add exact Chinese labels/arrows with Codex-authored SVG overlays, create source_coverage_report and writing_plan.json so the final note follows a novice-readable textbook narrative rather than raw subtitle order, compile the PDF, delete unused candidate frames unless debug/audit retention is requested, and run an independent QA gate before calling anything final/pass. Do not default to local API-key image generation unless the user explicitly approves API mode."
